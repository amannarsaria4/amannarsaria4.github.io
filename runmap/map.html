<style>
    #wrap {
        font-family: var(--font-sans);
        padding: 1rem 0;
    }

    #stats {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 1rem;
    }

    .sc {
        background: var(--color-background-secondary);
        border-radius: var(--border-radius-md);
        padding: 0.6rem 0.75rem;
    }

    .sl {
        font-size: 11px;
        color: var(--color-text-secondary);
        margin-bottom: 2px;
    }

    .sv {
        font-size: 20px;
        font-weight: 500;
        color: var(--color-text-primary);
    }

    #controls {
        display: flex;
        gap: 8px;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
    }

    button.ctrl {
        background: var(--color-background-primary);
        border: 0.5px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        padding: 5px 12px;
        font-size: 13px;
        cursor: pointer;
        color: var(--color-text-primary);
    }

    button.ctrl:hover {
        background: var(--color-background-secondary);
    }

    button.ctrl.active {
        background: var(--color-background-info);
        color: var(--color-text-info);
        border-color: var(--color-border-info);
    }

    #map {
        width: 100%;
        height: 480px;
        border-radius: var(--border-radius-lg);
        border: 0.5px solid var(--color-border-tertiary);
    }

    #loc-filter {
        font-size: 13px;
        color: var(--color-text-secondary);
        margin-left: auto;
    }

    select.ctrl {
        font-family: var(--font-sans);
        font-size: 13px;
        padding: 5px 10px;
        border-radius: var(--border-radius-md);
        border: 0.5px solid var(--color-border-secondary);
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        cursor: pointer;
    }
</style>

    let currentFilter = 'all';

    window.addEventListener('load', () => {
        map = L.map('map', { zoomControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
        }).addTo(map);

        routeGroup = L.layerGroup().addTo(map);

        const heatPts = [];
        const boundsAll = [];

        RUNS.forEach((run, i) => {
            const pts = run.w.filter(p => p[0] !== 0 && p[1] !== 0);
            if (pts.length < 2) return;
            const color = getColor(run.n);
            const poly = L.polyline(pts, { color, weight: 2.5, opacity: 0.8 });
            const pace = run.km > 0 ? (run.m / run.km).toFixed(1) : '–';
            poly.bindPopup(`<b style="font-size:13px">${run.n}</b><br><span style="color:#888;font-size:12px">${run.d}</span><br><br><span style="font-size:12px">${run.km} km &nbsp;·&nbsp; ${run.m} min &nbsp;·&nbsp; ${pace} min/km</span><br><span style="font-size:12px">HR: ${run.hr} bpm &nbsp;·&nbsp; ${run.cal} kcal</span>`);
            poly._runData = run;
            polylines.push(poly);
            poly.addTo(routeGroup);
            pts.forEach(p => { heatPts.push([p[0], p[1], 0.7]); boundsAll.push(p); });
        });

        if (boundsAll.length) {
            allBounds = L.latLngBounds(boundsAll.filter(p => p[0] !== 0));
            map.fitBounds(allBounds, { padding: [20, 20] });
        }

        heatLayer = L.heatLayer(heatPts, { radius: 10, blur: 14, maxZoom: 16, gradient: { 0.2: '#1D9E75', 0.5: '#FAC775', 1: '#E24B4A' } }).addTo(map);
    });

    function toggleLayer(which) {
        if (which === 'routes') {
            showRoutes = !showRoutes;
            showRoutes ? map.addLayer(routeGroup) : map.removeLayer(routeGroup);
            document.getElementById('btn-routes').classList.toggle('active', showRoutes);
        } else {
            showHeat = !showHeat;
            showHeat ? map.addLayer(heatLayer) : map.removeLayer(heatLayer);
            document.getElementById('btn-heat').classList.toggle('active', showHeat);
        }
    }

    function resetView() {
        if (allBounds) map.fitBounds(allBounds, { padding: [20, 20] });
    }

    function filterLocation(val) {
        currentFilter = val;
        routeGroup.clearLayers();
        const heatPts = [];
        polylines.forEach(poly => {
            const loc = getLocation(poly._runData.n);
            if (val === 'all' || loc === val) {
                poly.addTo(routeGroup);
                poly._latlngs[0].forEach && poly._latlngs.forEach(pt => heatPts.push([pt.lat, pt.lng, 0.7]));
            }
        });
    }
</script>
